name: test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  e2e-web:
    needs: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:e2e
      - run: npm run test:fc

  e2e-desktop:
    needs: unit
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Install com0com
        id: com0com
        shell: pwsh
        timeout-minutes: 12
        continue-on-error: true
        env:
          PRETTYCOM_COM0COM_DOWNLOAD_TIMEOUT_SEC: 180
          PRETTYCOM_COM0COM_INSTALL_TIMEOUT_SEC: 480
        run: npm run test:ports:install
      - name: Rust tests
        shell: pwsh
        run: |
          if ("${{ steps.com0com.outcome }}" -eq "success") {
            npm run test:rust
          } else {
            Write-Host "::warning::com0com unavailable on runner; running Rust library tests only."
            cargo test --manifest-path src-tauri/Cargo.toml --lib
          }
      - name: Desktop E2E scaffold
        run: npm run test:e2e:desktop
